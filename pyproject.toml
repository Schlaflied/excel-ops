[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "excel-ops"
version = "0.2.0"
description = "Reviewable image-to-Excel and spreadsheet operations pipeline"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["openpyxl>=3.1"]

[project.scripts]
excel-ops = "excel_ops.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
norecursedirs = ["pytest-cache-files-*"]
